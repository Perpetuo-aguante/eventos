<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tienda · Perpetuo</title>
<meta name="description" content="Gorras, bolsas y ropa de Perpetuo, revista literaria digital. Lleva la literatura y nuestros personajes a todos lados.">
<meta property="og:title" content="Tienda · Perpetuo">
<meta property="og:description" content="Lleva la literatura y nuestros personajes a todos lados. Envíos a todo México.">
<meta property="og:url" content="https://tienda.perpetuo.global">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/comun.css">
<style>
html{ scroll-behavior:smooth; }
.sitio{ max-width:1200px; margin:0 auto; padding:0 24px 56px; }
@media (max-width:560px){ .sitio{ padding:0 16px 44px; } }

/* ---------------- CABEZA ---------------- */
.top{ position:sticky; top:0; z-index:20; background:rgba(255,255,255,.92); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); border-bottom:1px solid var(--linea); }
.top-in{ max-width:1200px; margin:0 auto; padding:14px 24px; display:flex; justify-content:space-between; align-items:center; gap:16px; }
.marca{ display:flex; align-items:center; gap:12px; text-decoration:none; }
.marca .logo{ width:140px; }
.marca small{ font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px 2px; border:1.5px solid var(--tinta); border-radius:999px; }
.top nav{ display:flex; align-items:center; gap:22px; }
.top a.site{ font-size:14px; font-weight:600; text-decoration:none; color:var(--gris); }
.top a.site:hover{ color:var(--tinta); }
.abrir-bolsa{ appearance:none; border:0; background:none; cursor:pointer; display:inline-flex; align-items:center; gap:8px; font-weight:800; font-size:15px; padding:8px 0; }
.abrir-bolsa svg{ width:20px; height:20px; }
.abrir-bolsa .n{ min-width:22px; height:22px; padding:0 6px; border-radius:999px; background:var(--lima); display:inline-grid; place-items:center; font-size:12.5px; font-weight:900; font-variant-numeric:tabular-nums; }
.abrir-bolsa .n.salta{ animation:salta .4s var(--ease-spring); }
@keyframes salta{ 40%{ transform:translateY(-4px) scale(1.15); } }
@media (max-width:560px){ .top-in{ padding:12px 16px; } .marca .logo{ width:112px; } .top a.site{ display:none; } }

#vista{ outline:none; }
#vista.entra > *{ animation:entra .55s var(--ease-out) both; }
@keyframes entra{ from{ opacity:0; transform:translateY(18px); } to{ opacity:1; transform:none; } }

/* ---------------- MARCO DE FOTO (cuadrado) ---------------- */
/* Todas las fotos de producto viven en un .marco. Sin foto, se pinta un hueco rotulado. */
.marco{ position:relative; display:block; aspect-ratio:1/1; background:var(--papel); border-radius:4px; overflow:hidden; }
.marco img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
.hueco{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:20px; text-align:center; color:var(--gris); }
.hueco::before{ content:""; position:absolute; inset:12px; border:1.5px dashed rgba(13,17,20,.2); border-radius:3px; }
.hueco .sig{ width:44px; margin-bottom:8px; }
.hueco b{ font-family:var(--mano); font-weight:400; font-size:27px; line-height:1; color:var(--tinta); }
.hueco small{ font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
.mini .hueco{ padding:0; }
.mini .hueco::before{ inset:5px; }
.mini .hueco > *{ display:none; }
.mini .hueco::after{ content:attr(data-n); font-weight:900; font-size:15px; color:var(--gris); }
.etq{ position:absolute; top:12px; left:12px; z-index:2; background:var(--lima); color:var(--tinta); font-weight:800; font-size:12px; padding:4px 10px; border-radius:999px; }
.etq.fin{ background:var(--tinta); color:var(--papel); }

/* ---------------- PORTADA ---------------- */
/* abre con una foto grande, a sangre, y el titular a un lado */
.portada{ display:grid; grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr); margin:0 calc(50% - 50vw); min-height:min(calc(100svh - 100px), 900px); }
.po-texto{ display:flex; flex-direction:column; justify-content:flex-end; padding:48px 48px 44px max(24px, calc(50vw - 576px)); }
.kicker{ align-self:flex-start; font-size:13px; font-weight:800; letter-spacing:.02em; padding:4px 11px; border-radius:999px; background:var(--lima); }
.titular{ margin:20px 0 0; font-size:clamp(34px,4.5vw,68px); line-height:.94; font-weight:900; letter-spacing:-.055em; }
.titular .l{ display:block; overflow:hidden; padding-bottom:.1em; margin-bottom:-.1em; }
.titular .l > span{ display:inline-block; animation:sube .9s var(--ease-out) both; animation-delay:calc(var(--i) * 80ms + 80ms); }
.titular em{ font-style:normal; color:var(--azul); }
@keyframes sube{ from{ transform:translateY(105%) rotate(3deg); } to{ transform:none; } }
.bajar{ align-self:flex-start; display:inline-flex; align-items:center; gap:8px; margin-top:34px; font-weight:800; font-size:15px; text-decoration:none; color:var(--gris); animation:entra .8s .6s var(--ease-out) both; }
.bajar:hover{ color:var(--tinta); }
.bajar svg{ width:16px; height:16px; animation:baja 1.6s ease-in-out infinite; }
@keyframes baja{ 50%{ transform:translateY(4px); } }
.po-foto{ position:relative; display:block; text-decoration:none; animation:entra .9s .1s var(--ease-out) both; }
.po-foto .marco{ aspect-ratio:auto; height:100%; min-height:420px; border-radius:0; }
.po-foto .marco img{ transition:transform 1.4s var(--ease-out); }
.po-foto:hover .marco img{ transform:scale(1.03); }
.po-pie{ position:absolute; left:20px; bottom:20px; z-index:2; display:inline-flex; align-items:center; gap:10px; background:var(--fondo); border-radius:999px; padding:10px 18px; font-weight:800; font-size:15px;
  box-shadow:0 10px 24px -12px rgba(13,17,20,.35); transition:gap .3s var(--ease-out); }
.po-pie span{ color:var(--gris); font-weight:700; }
.po-pie svg{ width:15px; height:15px; }
.po-foto:hover .po-pie{ gap:14px; }
@media (max-width:860px){
  .portada{ grid-template-columns:1fr; min-height:0; }
  .po-foto{ order:-1; }
  .po-foto .marco{ min-height:0; height:auto; aspect-ratio:1/1; }
  .po-texto{ padding:26px 16px 8px; }
  .titular{ font-size:10vw; margin-top:14px; }
  .bajar{ display:none; }
}

/* la frase que sigue a la portada, con los personajes */
.frase{ padding:120px 0 40px; text-align:center; }
.frase p{ margin:0 auto; max-width:17ch; font-size:clamp(34px,5.2vw,68px); font-weight:900; letter-spacing:-.05em; line-height:.98; }
.frase em{ font-style:normal; color:var(--azul); }
.frase .desfile-fijo{ display:inline-flex; align-items:flex-end; gap:18px; margin-top:36px; }
@media (max-width:860px){ .frase{ padding:72px 0 16px; } }

/* el recorrido: una pieza por pantalla; el texto aparece al llegar */
.capitulo{ display:grid; grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr); gap:72px; align-items:center; padding:72px 0; }
.capitulo:nth-of-type(even) .c-foto{ order:2; }
.c-foto{ display:block; text-decoration:none; }
.c-foto.reveal{ transform:translateY(40px) scale(.97); transition-duration:1s; }
.c-foto.reveal.visto{ transform:none; }
.c-foto .marco img{ transition:transform 1.4s var(--ease-out), opacity .35s; }
.c-foto:hover .marco img{ transform:scale(1.03); }
.c-texto .reveal{ --i:calc(var(--o) + 2); }
.c-num{ display:block; font-size:13px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--gris); }
.c-num b{ color:var(--azul); font-weight:800; }
.c-texto h2{ margin:12px 0 0; font-size:clamp(40px,5.6vw,80px); font-weight:900; letter-spacing:-.055em; line-height:.92; }
.c-texto h2 a{ text-decoration:none; }
.c-texto p{ margin:20px 0 0; font-size:18px; line-height:1.5; max-width:36ch; color:var(--gris); }
.c-pie{ display:flex; align-items:center; gap:20px; margin-top:28px; }
.c-pie .precio{ font-size:24px; font-weight:900; letter-spacing:-.03em; }
.c-pie .precio small{ font-size:12px; font-weight:800; letter-spacing:.03em; margin-left:4px; color:var(--gris); }
.c-pie .btn{ padding:13px 24px; font-size:16px; }
.c-pie .fin{ font-size:13.5px; font-weight:800; color:var(--rojo); }
@media (max-width:860px){
  .capitulo{ grid-template-columns:1fr; gap:22px; padding:36px 0; }
  .capitulo:nth-of-type(even) .c-foto{ order:0; }
  .c-texto h2{ font-size:12vw; }
  .c-texto p{ font-size:16.5px; margin-top:12px; }
  .c-pie{ margin-top:18px; }
}

/* índice: todas las piezas en una sola lista */
.indice{ padding-top:96px; scroll-margin-top:60px; }
.indice > h2{ margin:0; padding-bottom:16px; border-bottom:1.5px solid var(--tinta); font-size:13px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--gris); }
.indice ol{ list-style:none; margin:0; padding:0; }
.renglon a{ display:grid; grid-template-columns:44px auto 1fr auto 24px; align-items:center; gap:0 16px; padding:18px 0; border-bottom:1px solid var(--linea); text-decoration:none; }
.renglon .n{ font-size:13px; font-weight:800; color:var(--gris); font-variant-numeric:tabular-nums; }
.renglon .nom{ font-size:clamp(24px,3.6vw,44px); font-weight:900; letter-spacing:-.045em; line-height:1; transition:transform .35s var(--ease-out), color .2s; }
.renglon .puntos{ border-bottom:2px dotted rgba(13,17,20,.28); min-width:20px; }
.renglon .precio{ font-size:17px; font-weight:800; font-variant-numeric:tabular-nums; }
.renglon .precio small{ display:block; font-size:12.5px; font-weight:700; color:var(--gris); text-align:right; }
.renglon svg{ width:18px; height:18px; transition:transform .35s var(--ease-out); }
.renglon a:hover .nom{ transform:translateX(8px); color:var(--azul); }
.renglon a:hover svg{ transform:translateX(5px); }
.renglon.agotado .nom{ color:rgba(13,17,20,.4); }
@media (max-width:560px){ .indice{ padding-top:64px; } .renglon a{ grid-template-columns:30px auto 1fr auto; gap:0 10px; } .renglon svg{ display:none; } }

/* ---------------- REJILLA ---------------- */
.rejilla{ list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:44px 24px; }
@media (max-width:860px){ .rejilla{ grid-template-columns:repeat(2,minmax(0,1fr)); gap:28px 14px; } }

.reveal{ opacity:0; transform:translateY(24px); transition:opacity .7s var(--ease-out), transform .7s var(--ease-out); transition-delay:calc(var(--i,0) * 70ms); }
.reveal.visto{ opacity:1; transform:none; }

.pieza a{ display:block; text-decoration:none; }
.marco img.otra{ opacity:0; }
.pieza a:hover .marco img.otra, .c-foto:hover .marco img.otra{ opacity:1; }
.pieza a:hover .marco img{ transform:scale(1.03); }
.p-info{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-top:12px; }
.p-info h3{ margin:0; font-size:17px; font-weight:800; letter-spacing:-.02em; line-height:1.2; }
.p-info .precio{ font-size:16px; font-weight:700; white-space:nowrap; }
.p-cat{ display:block; margin-top:2px; font-size:13.5px; color:var(--gris); }
.pieza.agotado .marco > :not(.etq){ opacity:.45; }
.pieza.agotado .precio{ text-decoration:line-through; color:var(--gris); }
@media (max-width:560px){ .p-info{ flex-direction:column; gap:2px; } .p-info h3{ font-size:15.5px; } .hueco b{ font-size:22px; } .hueco small{ font-size:9.5px; } }

.vacio{ grid-column:1 / -1; background:var(--papel); border-radius:4px; padding:56px 28px; text-align:center; }
.vacio .bicho{ width:70px; margin:0 auto 14px; }
.vacio h3{ margin:0; font-size:26px; font-weight:900; letter-spacing:-.03em; }
.vacio p{ margin:8px auto 0; max-width:40ch; color:var(--gris); }
.esqueleto{ aspect-ratio:1/1; border-radius:4px; background:linear-gradient(100deg, var(--papel) 30%, var(--papel-2) 50%, var(--papel) 70%) 0 0/300% 100%; animation:brillo 1.4s linear infinite; }
@keyframes brillo{ to{ background-position:-150% 0; } }

/* cómo funciona: tres notas al pie de la rejilla */
.notas{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:0 32px; margin-top:96px; border-top:1.5px solid var(--tinta); }
.notas div{ padding:20px 0 0; }
.notas h3{ margin:0; font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--gris); }
.notas p{ margin:6px 0 0; font-size:15.5px; line-height:1.45; max-width:34ch; }
@media (max-width:700px){ .notas{ grid-template-columns:1fr; margin-top:64px; } .notas div + div{ margin-top:18px; border-top:1px solid var(--linea); } }

/* desfile: los signos caminan sobre la línea del pie */
.desfile{ position:relative; height:66px; margin-top:72px; overflow:hidden; pointer-events:none; }
.caminante{ position:absolute; bottom:-2px; left:0; width:var(--w); animation:camina var(--dur) linear infinite; animation-delay:var(--dl); }
.caminante .bicho{ --t:.42s; }
@keyframes camina{ from{ transform:translateX(-120px); } to{ transform:translateX(min(100vw, 1240px)); } }

/* ---------------- DETALLE ---------------- */
.volver{ display:inline-flex; align-items:center; gap:8px; margin:30px 0 22px; font-weight:800; font-size:15px; text-decoration:none; color:var(--gris); }
.volver:hover{ color:var(--tinta); }
.volver svg{ width:16px; height:16px; transition:transform .25s var(--ease-out); }
.volver:hover svg{ transform:translateX(-4px); }
.det{ display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr); gap:64px; align-items:start; }
@media (max-width:900px){ .det{ grid-template-columns:1fr; gap:26px; } }
.miniaturas{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px; margin-top:10px; }
.mini{ appearance:none; border:0; padding:0; cursor:pointer; opacity:.6; transition:opacity .2s, box-shadow .2s; }
.mini:hover{ opacity:1; }
.mini[aria-pressed="true"]{ opacity:1; box-shadow:0 0 0 2px var(--fondo), 0 0 0 3.5px var(--tinta); }
.ficha{ position:sticky; top:86px; }
@media (max-width:900px){ .ficha{ position:static; } }
.ficha .cat{ font-size:13px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--azul); }
.ficha h1{ margin:8px 0 0; font-size:clamp(34px,4.4vw,52px); font-weight:900; letter-spacing:-.05em; line-height:.96; }
.ficha .precio{ display:block; margin-top:14px; font-size:26px; font-weight:800; letter-spacing:-.03em; }
.ficha .precio small{ font-size:13px; font-weight:800; letter-spacing:.03em; margin-left:4px; color:var(--gris); }
.desc{ margin-top:20px; font-size:17px; line-height:1.6; max-width:52ch; }
.desc p{ margin:0 0 .9em; }
.desc a{ color:var(--azul); font-weight:700; }
.opciones{ margin:26px 0 0; padding:22px 0 0; border:0; border-top:1px solid var(--linea); min-width:0; }
.opciones legend, .paso .lbl{ padding:0; font-size:14px; font-weight:800; }
.opciones legend{ float:left; width:100%; margin-bottom:10px; }
.tallas{ clear:both; display:flex; flex-wrap:wrap; gap:8px; }
.talla input{ position:absolute; opacity:0; pointer-events:none; }
.talla span{ display:grid; place-items:center; min-width:52px; height:46px; padding:0 14px; border-radius:999px; font-weight:800; font-size:15px; cursor:pointer;
  box-shadow:inset 0 0 0 1.5px var(--linea); transition:box-shadow .15s, background-color .15s, color .15s; }
.talla:hover span{ box-shadow:inset 0 0 0 1.5px var(--tinta); }
.talla input:checked + span{ background:var(--tinta); color:var(--papel); box-shadow:none; }
.talla input:focus-visible + span{ outline:3px solid var(--azul); outline-offset:3px; }
.talla input:disabled + span{ cursor:not-allowed; color:rgba(13,17,20,.35); text-decoration:line-through; box-shadow:inset 0 0 0 1.5px var(--linea); background:var(--papel); }
.opciones .msg{ clear:both; }
.opciones.bad .msg{ display:block; margin-top:10px; }
.quedan{ display:block; margin-top:10px; font-size:13.5px; font-weight:800; color:var(--rojo); min-height:1.4em; }
.paso{ display:flex; align-items:center; justify-content:space-between; margin:14px 0 18px; }
.stepper{ display:inline-flex; align-items:center; gap:2px; border-radius:999px; padding:3px; box-shadow:inset 0 0 0 1.5px var(--linea); }
.stepper button{ width:36px; height:36px; border:0; border-radius:50%; background:transparent; font-size:21px; font-weight:700; line-height:1; cursor:pointer; transition:background-color .15s, transform .15s var(--ease-out); }
.stepper button:hover:not(:disabled){ background:var(--papel-2); }
.stepper button:active:not(:disabled){ transform:scale(.88); }
.stepper button:disabled{ opacity:.3; cursor:default; }
.stepper output{ min-width:30px; text-align:center; font-weight:900; font-size:17px; font-variant-numeric:tabular-nums; }
.stepper.sm button{ width:28px; height:28px; font-size:17px; }
.stepper.sm output{ min-width:22px; font-size:14.5px; }
.ficha .btn{ width:100%; }
.fino{ display:flex; gap:8px; align-items:flex-start; margin:14px 0 0; font-size:13.5px; line-height:1.4; color:var(--gris); }
.fino svg{ width:15px; height:15px; flex:none; margin-top:1px; }
.mas{ margin-top:26px; border-top:1px solid var(--linea); }
.mas details{ border-bottom:1px solid var(--linea); }
.mas summary{ cursor:pointer; list-style:none; display:flex; justify-content:space-between; align-items:center; padding:15px 0; font-weight:800; font-size:15px; }
.mas summary::-webkit-details-marker{ display:none; }
.mas summary svg{ width:15px; height:15px; transition:transform .3s var(--ease-out); }
.mas details[open] summary svg{ transform:rotate(180deg); }
.mas .txt{ padding:0 0 16px; font-size:15px; line-height:1.55; color:var(--gris); max-width:52ch; }
.mas .txt p{ margin:0 0 .7em; }
.otras{ margin-top:96px; }
.otras h2{ margin:0 0 24px; padding-bottom:16px; border-bottom:1.5px solid var(--tinta); font-size:clamp(24px,3vw,32px); font-weight:900; letter-spacing:-.04em; }

/* ---------------- BOLSA (cajón lateral) ---------------- */
dialog.bolsa{ margin:0 0 0 auto; width:min(440px,100%); height:100dvh; max-height:none; max-width:none; border:0; padding:0; background:var(--fondo); color:var(--tinta); box-shadow:-30px 0 60px -30px rgba(13,17,20,.35); }
dialog.bolsa[open]{ display:flex; flex-direction:column; animation:cajon .45s var(--ease-out); }
dialog.bolsa::backdrop{ background:rgba(13,17,20,.38); animation:velo .3s both; }
@keyframes cajon{ from{ transform:translateX(100%); } }
@keyframes velo{ from{ opacity:0; } }
.bo-top{ display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--linea); }
.bo-top h2{ margin:0; font-size:22px; font-weight:900; letter-spacing:-.035em; }
.bo-top h2 small{ font-size:14px; font-weight:700; color:var(--gris); letter-spacing:0; margin-left:6px; }
.cerrar{ appearance:none; border:0; background:none; cursor:pointer; width:38px; height:38px; border-radius:50%; display:grid; place-items:center; }
.cerrar:hover{ background:var(--papel-2); }
.cerrar svg{ width:18px; height:18px; }
.bo-cuerpo{ flex:1; overflow-y:auto; padding:6px 22px; }
.lineas{ list-style:none; margin:0; padding:0; }
.linea{ display:grid; grid-template-columns:72px 1fr auto; gap:14px; padding:16px 0; border-bottom:1px solid var(--linea); }
.linea b{ display:block; font-size:15.5px; font-weight:800; letter-spacing:-.015em; line-height:1.2; }
.linea b a{ text-decoration:none; }
.linea small{ display:block; margin:2px 0 10px; font-size:13.5px; color:var(--gris); }
.linea .der{ display:flex; flex-direction:column; align-items:flex-end; justify-content:space-between; }
.linea .der span{ font-weight:800; font-size:15px; font-variant-numeric:tabular-nums; }
.quitar{ appearance:none; border:0; background:none; padding:0; cursor:pointer; font-size:13px; font-weight:700; color:var(--gris); text-decoration:underline; text-underline-offset:3px; }
.quitar:hover{ color:var(--rojo); }
.bo-vacia{ text-align:center; padding:64px 10px; }
.bo-vacia .bicho{ width:60px; margin:0 auto 16px; }
.bo-vacia h3{ margin:0; font-size:22px; font-weight:900; letter-spacing:-.03em; }
.bo-vacia p{ margin:8px auto 22px; max-width:30ch; color:var(--gris); }
.bo-pie{ padding:18px 22px calc(22px + env(safe-area-inset-bottom)); border-top:1.5px solid var(--tinta); }
.gratis{ margin-bottom:16px; font-size:13.5px; font-weight:700; }
.gratis-barra{ height:4px; border-radius:99px; background:var(--papel-3); overflow:hidden; margin-top:7px; }
.gratis-barra i{ display:block; height:100%; width:calc(var(--p) * 100%); background:var(--tinta); border-radius:99px; transition:width .5s var(--ease-out); }
.gratis.ya .gratis-barra i{ background:var(--lima); }
.cuenta{ margin:0; display:grid; grid-template-columns:1fr auto; gap:6px 0; font-size:15px; }
.cuenta dt{ color:var(--gris); }
.cuenta dd{ margin:0; text-align:right; font-weight:700; font-variant-numeric:tabular-nums; }
.cuenta .tot{ padding-top:10px; margin-top:4px; border-top:1px solid var(--linea); font-size:17px; font-weight:800; color:var(--tinta); }
.cuenta dd.tot{ font-size:24px; font-weight:900; letter-spacing:-.04em; }
.bo-pie .btn{ width:100%; margin-top:16px; }
.senderr{ display:none; margin:14px 0 0; padding:11px 13px; border:1.5px solid var(--rojo); border-radius:3px; color:var(--rojo); font-weight:700; font-size:14px; }
.senderr.on{ display:block; animation:sacude .4s; }
@keyframes sacude{ 20%,60%{ transform:translateX(-5px); } 40%,80%{ transform:translateX(5px); } }

/* ---------------- PEDIDO (después de pagar) ---------------- */
.exito{ max-width:620px; margin:0 auto; padding:56px 0 0; text-align:center; }
.exito h1{ margin:26px 0 0; font-size:clamp(38px,6vw,64px); font-weight:900; letter-spacing:-.05em; line-height:.95; }
.exito h1 em{ font-style:normal; color:var(--azul); }
.exito .lead{ margin:16px auto 0; max-width:46ch; font-size:17.5px; color:var(--gris); }
.exito .lead b{ color:var(--tinta); }
.recibo{ margin-top:36px; text-align:left; border:1.5px solid var(--tinta); border-radius:6px; overflow:hidden; }
.r-cabeza{ display:flex; justify-content:space-between; align-items:center; gap:12px; padding:16px 22px; background:var(--tinta); color:var(--papel); }
.r-cabeza .logo{ width:96px; }
.r-cabeza span:last-child{ font-size:12px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; }
.r-cuerpo{ padding:6px 22px 20px; }
.r-lineas{ list-style:none; margin:0; padding:0; }
.r-lineas li{ display:flex; justify-content:space-between; gap:16px; padding:13px 0; border-bottom:1px solid var(--linea); font-weight:700; }
.r-lineas small{ display:block; font-weight:500; font-size:13.5px; color:var(--gris); }
.r-lineas li > span:last-child{ font-variant-numeric:tabular-nums; white-space:nowrap; }
.r-cuerpo .cuenta{ margin-top:14px; }
.r-pie{ display:grid; grid-template-columns:auto 1fr; gap:6px 28px; padding:16px 22px 18px; border-top:2px dashed rgba(13,17,20,.22); }
.r-pie small{ display:block; font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--gris); }
.r-pie b{ font-size:22px; font-weight:900; letter-spacing:.04em; color:var(--rojo); }
.r-pie p{ margin:0; font-weight:700; font-size:14.5px; line-height:1.35; }
@media (max-width:480px){ .r-pie{ grid-template-columns:1fr; gap:14px; } }
.exito .acts{ margin-top:30px; }
.desfile-fijo{ display:inline-flex; align-items:flex-end; gap:16px; }
.desfile-fijo .bicho{ height:54px; width:auto; --t:.5s; }
.desfile-fijo .bicho:nth-child(2){ --d:-.2s; } .desfile-fijo .bicho:nth-child(3){ --d:-.45s; } .desfile-fijo .bicho:nth-child(4){ --d:-.1s; }
.esperando{ padding:90px 0 60px; text-align:center; }
.esperando .bicho{ width:84px; margin:0 auto 22px; animation:flota 1.6s ease-in-out infinite; }
.esperando h1{ margin:0; font-size:clamp(30px,5vw,44px); font-weight:900; letter-spacing:-.04em; }
.esperando p{ margin:12px auto 0; max-width:42ch; color:var(--gris); }

/* confeti de signos */
.confeti{ position:fixed; inset:0; pointer-events:none; z-index:60; overflow:hidden; }
.confeti span{ position:absolute; top:-60px; left:var(--x); font-weight:900; font-size:var(--s); color:var(--col); line-height:1;
  animation:cae var(--dur) var(--dl) cubic-bezier(.25,.4,.6,1) forwards; }
@keyframes cae{ to{ transform:translate(var(--dx), 112vh) rotate(var(--rot)); } }

.aviso-demo{ background:var(--lima); color:var(--tinta); text-align:center; font-size:13.5px; font-weight:700; padding:8px 16px; }
.aviso-demo b{ font-weight:900; }
footer{ padding-top:20px; border-top:1.5px solid var(--tinta); color:var(--gris); font-size:13.5px; display:flex; flex-wrap:wrap; gap:8px 24px; justify-content:space-between; }
footer a{ color:var(--tinta); }
</style>
</head>
<body>
<div class="aviso-demo" id="avisoDemo" hidden><b>Modo demostración:</b> productos de ejemplo y pagos simulados; no se cobra nada. Falta conectar Stripe (ver README).</div>
<header class="top"><div class="top-in">
  <a class="marca" href="#/" aria-label="Tienda de Perpetuo"><span class="logo" role="img" aria-label="Perpetuo"></span><small>Tienda</small></a>
  <nav>
    <a class="site" href="https://perpetuo.global" target="_blank" rel="noopener">Leer Perpetuo →</a>
    <button class="abrir-bolsa" id="abrirBolsa" type="button" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12.5H6L5 8z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>
      Bolsa <span class="n" id="cuentaBolsa" hidden>0</span>
    </button>
  </nav>
</div></header>

<div class="sitio">
  <main id="vista" tabindex="-1" aria-live="polite"></main>
  <div class="desfile" id="desfile" aria-hidden="true"></div>
  <footer>
    <span>© Perpetuo · <a href="https://perpetuo.global">perpetuo.global</a></span>
    <span>¿Dudas con tu pedido? Escríbenos a <a href="mailto:general@perpetuo.global">general@perpetuo.global</a></span>
  </footer>
</div>

<dialog class="bolsa" id="bolsa" aria-labelledby="hBolsa"></dialog>
<div class="toast" id="toast" role="status"></div>

<script src="assets/comun.js"></script>
<script>
const ICO = {
  flecha: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  atras: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
  candado: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>',
  caja: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8 12 3.5 20.5 8v8L12 20.5 3.5 16V8z"/><path d="M3.5 8 12 12.5 20.5 8M12 12.5v8"/></svg>',
  abajo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>',
  cruz: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>'
};

const vista = document.getElementById("vista");
const cajon = document.getElementById("bolsa");
const reducido = matchMedia("(prefers-reduced-motion: reduce)").matches;
let PRODUCTOS = null;                          // null = todavía cargando
let ENVIO = { costo: 100, gratisDesde: 0 };    // lo confirma el backend; gratisDesde 0 = nunca gratis
let scrollLista = 0;

/* ---------------- datos ---------------- */
try { const c = JSON.parse(localStorage.getItem(CONFIG.CLAVE_CACHE) || "null"); if (c) { PRODUCTOS = c.productos; ENVIO = c.envio; } } catch (e) {}

async function cargarProductos() {
  try {
    const { productos, envio } = await api("productos");
    const nuevo = JSON.stringify({ productos, envio }), antes = JSON.stringify({ productos: PRODUCTOS, envio: ENVIO });
    PRODUCTOS = productos; ENVIO = envio;
    try { localStorage.setItem(CONFIG.CLAVE_CACHE, nuevo); } catch (e) {}
    if (nuevo !== antes && ruta().vista !== "pedido") pintar(false);
    pintarBolsa();
  } catch (e) {
    console.error(e);
    if (!PRODUCTOS) { PRODUCTOS = []; pintar(false); toast("No pudimos cargar la tienda. Recarga la página.", true); }
  }
}

const existencias = p => p.variantes.reduce((s, v) => s + v.disponibles, 0);
const agotado = p => existencias(p) === 0;
const conTallas = p => p.variantes.length > 1 || !!p.variantes[0].nombre;
const color = p => "c-" + (COLORES.includes(p.color) ? p.color : "azul");

/* Una foto de producto o, si todavía no existe, el hueco rotulado donde va. */
function foto(p, i, nota, clase) {
  const src = (p.imagenes || [])[i];
  if (src) return `<img${clase ? ` class="${clase}"` : ""} src="${esc(src)}" alt="" loading="lazy">`;
  if (clase) return "";
  return `<span class="hueco" data-n="${i + 1}"><span class="sig"><span data-b="${esc(p.signo)}"></span></span><b>${nota || "aquí va la foto"}</b><small>Foto ${i + 1} · cuadrada · 1600 × 1600 px</small></span>`;
}
function etiqueta(p) {
  if (agotado(p)) return '<span class="etq fin">Agotado</span>';
  return p.etiqueta ? `<span class="etq">${esc(p.etiqueta)}</span>` : "";
}

/* ---------------- bolsa ---------------- */
const Bolsa = {
  leer() { try { return JSON.parse(localStorage.getItem(CONFIG.CLAVE_BOLSA)) || []; } catch (e) { return []; } },
  guardar(l) { try { localStorage.setItem(CONFIG.CLAVE_BOLSA, JSON.stringify(l)); } catch (e) {} pintarBolsa(); },
  agregar(id, variante, n) {
    const l = this.leer(), x = l.find(i => i.id === id && i.variante === variante);
    x ? x.cantidad += n : l.push({ id, variante, cantidad: n });
    this.guardar(l);
  },
  poner(id, variante, n) { this.guardar(this.leer().map(i => i.id === id && i.variante === variante ? { ...i, cantidad: n } : i).filter(i => i.cantidad > 0)); },
  vaciar() { this.guardar([]); },
  // cada renglón con su producto y su tope; con el catálogo cargado, lo que ya no existe o se agotó sale de la bolsa
  lineas() {
    const l = this.leer();
    if (!PRODUCTOS) return [];
    const vivas = [];
    l.forEach(i => {
      const p = PRODUCTOS.find(x => x.id === i.id), v = p && p.variantes.find(x => x.nombre === i.variante);
      const max = v ? Math.min(v.disponibles, CONFIG.MAX_POR_ARTICULO) : 0;
      if (max > 0) vivas.push({ ...i, cantidad: Math.min(i.cantidad, max), p, max });
    });
    const limpia = vivas.map(({ id, variante, cantidad }) => ({ id, variante, cantidad }));
    if (JSON.stringify(limpia) !== JSON.stringify(l)) try { localStorage.setItem(CONFIG.CLAVE_BOLSA, JSON.stringify(limpia)); } catch (e) {}
    return vivas;
  }
};

function pintarBolsa() {
  const ls = Bolsa.lineas();
  const piezas = ls.reduce((s, i) => s + i.cantidad, 0), sub = ls.reduce((s, i) => s + i.p.precio * i.cantidad, 0);
  const envio = ENVIO.gratisDesde && sub >= ENVIO.gratisDesde ? 0 : ENVIO.costo, falta = ENVIO.gratisDesde - sub;
  const n = document.getElementById("cuentaBolsa");
  if (n.textContent !== String(piezas)) { n.textContent = piezas; n.classList.remove("salta"); void n.offsetWidth; n.classList.add("salta"); }
  n.hidden = !piezas;
  document.getElementById("abrirBolsa").setAttribute("aria-label", piezas ? `Bolsa: ${piezas} ${piezas === 1 ? "pieza" : "piezas"}` : "Bolsa vacía");

  cajon.innerHTML = `
  <div class="bo-top"><h2 id="hBolsa">Tu bolsa${piezas ? `<small>${piezas} ${piezas === 1 ? "pieza" : "piezas"}</small>` : ""}</h2>
    <button class="cerrar" type="button" data-cerrar aria-label="Cerrar la bolsa">${ICO.cruz}</button></div>
  <div class="bo-cuerpo">${ls.length ? `<ul class="lineas">${ls.map(i => `
    <li class="linea" data-id="${esc(i.id)}" data-v="${esc(i.variante)}">
      <a class="marco mini" href="#/p/${encodeURIComponent(i.p.slug)}" data-cerrar tabindex="-1" aria-hidden="true">${foto(i.p, 0)}</a>
      <div><b><a href="#/p/${encodeURIComponent(i.p.slug)}" data-cerrar>${esc(i.p.nombre)}</a></b><small>${i.variante ? "Talla " + esc(i.variante) : esc(i.p.categoria)}</small>
        <div class="stepper sm" role="group" aria-label="Cantidad"><button type="button" data-d="-1" aria-label="Una menos">−</button><output>${i.cantidad}</output><button type="button" data-d="1" aria-label="Una más"${i.cantidad >= i.max ? " disabled" : ""}>+</button></div></div>
      <div class="der"><span>${dinero(i.p.precio * i.cantidad)}</span><button class="quitar" type="button" data-d="-99">Quitar</button></div>
    </li>`).join("")}</ul>`
    : `<div class="bo-vacia"><span data-b="coma"></span><h3>Tu bolsa está vacía.</h3><p>Lo que agregues se queda aquí guardado hasta que pagues.</p><a class="btn" href="#/" data-cerrar>Ver la tienda</a></div>`}</div>
  ${ls.length ? `<div class="bo-pie">
    ${!ENVIO.gratisDesde ? "" : `<div class="gratis${falta <= 0 ? " ya" : ""}">${falta > 0 ? `Te faltan ${dinero(falta)} para el envío gratis.` : "Tu envío va por nuestra cuenta."}
      <div class="gratis-barra"><i style="--p:${Math.min(sub / ENVIO.gratisDesde, 1).toFixed(3)}"></i></div></div>`}
    <dl class="cuenta"><dt>Subtotal</dt><dd>${dinero(sub)}</dd><dt>Envío a todo México</dt><dd>${envio ? dinero(envio) : "Gratis"}</dd>
      <dt class="tot">Total</dt><dd class="tot">${dinero(sub + envio)} <small style="font-size:12px;letter-spacing:.03em;color:var(--gris)">MXN</small></dd></dl>
    <button class="btn" id="pagar" type="button">Pagar con tarjeta ${ICO.flecha}</button>
    <p class="fino">${ICO.candado}${CONFIG.API_URL ? "Pago seguro con Stripe. Ahí mismo nos das tu dirección de envío." : "Demostración: el pago se simula y no se cobra nada."}</p>
    <div class="senderr" id="senderr" role="alert"></div>
  </div>` : ""}`;
  pintarBichos(cajon);
}

document.getElementById("abrirBolsa").addEventListener("click", () => cajon.showModal());
cajon.addEventListener("click", ev => {
  if (ev.target === cajon || ev.target.closest("[data-cerrar]")) { cajon.close(); return; }
  const paso = ev.target.closest("[data-d]");
  if (paso) {
    const li = paso.closest(".linea"), actual = Bolsa.leer().find(i => i.id === li.dataset.id && i.variante === li.dataset.v);
    Bolsa.poner(li.dataset.id, li.dataset.v, Math.max(0, (actual ? actual.cantidad : 0) + Number(paso.dataset.d)));
    return;
  }
  if (ev.target.closest("#pagar")) pagar();
});

async function pagar() {
  const btn = document.getElementById("pagar"), original = btn.innerHTML;
  btn.disabled = true; btn.classList.add("espera");
  btn.innerHTML = '<span class="gira"></span>Te llevamos al pago…';
  try {
    const r = await api("pedido", { items: Bolsa.leer(), volver: location.origin + location.pathname });
    location.href = r.url; // a Stripe Checkout
  } catch (x) {
    if (["producto", "existencias"].includes(x.message)) await cargarProductos(); // repinta la bolsa ya ajustada
    else { btn.disabled = false; btn.classList.remove("espera"); btn.innerHTML = original; }
    const err = document.getElementById("senderr");
    if (err) { err.textContent = errorTexto(x); err.classList.add("on"); } else toast(errorTexto(x), true);
  }
}

/* ---------------- rutas ---------------- */
function ruta() {
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  if (h.startsWith("p/")) return { vista: "detalle", slug: h.slice(2) };
  if (h === "pedido") return { vista: "pedido" };
  return { vista: "lista" };
}

function pintar(animar = true) {
  const r = ruta();
  if (r.vista === "lista") vistaLista();
  else if (r.vista === "detalle") vistaDetalle(r.slug);
  else vistaPedido();
  pintarBichos(vista);
  observar();
  if (animar) { vista.classList.remove("entra"); void vista.offsetWidth; vista.classList.add("entra"); }
}

let rutaAnterior = ruta().vista;
window.addEventListener("hashchange", () => {
  const r = ruta();
  if (rutaAnterior === "lista") scrollLista = scrollY;
  const cambiar = () => { pintar(); window.scrollTo({ top: r.vista === "lista" ? scrollLista : 0, behavior: "instant" }); };
  if (document.startViewTransition && !reducido) document.startViewTransition(cambiar); else cambiar();
  rutaAnterior = r.vista;
});

/* aparición al hacer scroll */
const io = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { e.target.classList.add("visto"); io.unobserve(e.target); }
}), { rootMargin: "0px 0px -14% 0px" }) : null;
function observar() { vista.querySelectorAll(".reveal:not(.visto)").forEach(el => io ? io.observe(el) : el.classList.add("visto")); }

/* ---------------- LISTA ---------------- */
function tarjeta(p, i) {
  const tallas = conTallas(p) ? p.variantes.filter(v => v.disponibles > 0).map(v => v.nombre).join(" · ") : "";
  return `
  <li class="pieza reveal${agotado(p) ? " agotado" : ""}" style="--i:${i % 3}">
    <a href="#/p/${encodeURIComponent(p.slug)}">
      <span class="marco">${foto(p, 0)}${foto(p, 1, "", "otra")}${etiqueta(p)}</span>
      <span class="p-info"><h3>${esc(p.nombre)}</h3><span class="precio">${dinero(p.precio)}</span></span>
      <span class="p-cat">${esc(p.categoria)}${tallas ? " · " + esc(tallas) : ""}</span>
    </a>
  </li>`;
}

const dos = n => String(n).padStart(2, "0");
const textoEnvio = () => `A todo México por ${dinero(ENVIO.costo)}` + (ENVIO.gratisDesde ? `; gratis desde ${dinero(ENVIO.gratisDesde)}` : "");

/* una pieza del recorrido: foto grande a un lado y, al llegar, el texto */
function capitulo(p, i, total) {
  const href = "#/p/" + encodeURIComponent(p.slug);
  return `
  <article class="capitulo">
    <a class="c-foto reveal" href="${href}" tabindex="-1" aria-hidden="true"><span class="marco">${foto(p, 0)}${foto(p, 1, "", "otra")}${etiqueta(p)}</span></a>
    <div class="c-texto">
      <span class="c-num reveal" style="--o:0"><b>${dos(i + 1)}</b> / ${dos(total)} · ${esc(p.categoria)}</span>
      <h2 class="reveal" style="--o:1"><a href="${href}">${esc(p.nombre)}</a></h2>
      ${p.resumen ? `<p class="reveal" style="--o:2">${esc(p.resumen)}</p>` : ""}
      <div class="c-pie reveal" style="--o:3"><span class="precio">${dinero(p.precio)}<small>MXN</small></span>
        <a class="btn" href="${href}">Ver la pieza ${ICO.flecha}</a>${agotado(p) ? '<span class="fin">Agotada</span>' : ""}</div>
    </div>
  </article>`;
}

function vistaLista() {
  document.title = "Tienda · Perpetuo";
  const todos = PRODUCTOS || [];
  const estrella = todos.find(p => p.destacado && !agotado(p)) || todos.find(p => !agotado(p)) || todos[0];
  const lineas = ["La comunidad", "más grande", "de literatura", "<em>en español</em>."];

  vista.innerHTML = `
  <section class="portada">
    <div class="po-texto">
      <span class="kicker">Perpetuo · Tienda</span>
      <h1 class="titular" aria-label="La comunidad más grande de literatura en español.">${lineas.map((l, i) => `<span class="l" aria-hidden="true"><span style="--i:${i}">${l}</span></span>`).join("")}</h1>
      ${todos.length ? `<a class="bajar" href="#recorrido" onclick="event.preventDefault();document.getElementById('recorrido').scrollIntoView({behavior:'smooth'})">Baja para ver las piezas ${ICO.abajo}</a>` : ""}
    </div>
    ${PRODUCTOS === null ? '<div class="esqueleto" style="aspect-ratio:auto;border-radius:0"></div>' : estrella ? `
    <a class="po-foto" href="#/p/${encodeURIComponent(estrella.slug)}" aria-label="${esc(estrella.nombre)}, ${dinero(estrella.precio)}">
      <span class="marco">${foto(estrella, 0, "aquí va la foto grande")}</span>
      <span class="po-pie">${esc(estrella.nombre)} <span>${dinero(estrella.precio)}</span> ${ICO.flecha}</span>
    </a>` : '<div class="marco" style="aspect-ratio:auto;border-radius:0"></div>'}
  </section>

  <section class="frase" id="recorrido">
    <p class="reveal">Lleva la literatura y <em>nuestros personajes</em> a todos lados.</p>
    <div class="desfile-fijo reveal" style="--i:2" aria-hidden="true"><span data-b="punto"></span><span data-b="coma"></span><span data-b="exclamacion"></span><span data-b="interrogacion"></span></div>
  </section>

  ${PRODUCTOS !== null && !todos.length ? `<div class="vacio"><span data-b="interrogacion"></span><h3>Estamos cosiendo lo que sigue.</h3>
    <p>Por ahora no hay piezas a la venta. Suscríbete a <a href="https://perpetuo.global">Perpetuo</a> y te avisamos antes que a nadie.</p></div>` : ""}
  <div class="recorrido">${todos.map((p, i) => capitulo(p, i, todos.length)).join("")}</div>

  ${todos.length ? `<section class="indice" id="indice" aria-labelledby="hIndice">
    <h2 id="hIndice">Índice · ${todos.length} ${todos.length === 1 ? "pieza" : "piezas"}</h2>
    <ol>${todos.map((p, i) => `<li class="renglon reveal${agotado(p) ? " agotado" : ""}" style="--i:${i}"><a href="#/p/${encodeURIComponent(p.slug)}">
      <span class="n">${dos(i + 1)}</span><span class="nom">${esc(p.nombre)}</span><span class="puntos" aria-hidden="true"></span>
      <span class="precio">${dinero(p.precio)}<small>${agotado(p) ? "Agotada" : esc(p.categoria)}</small></span>${ICO.flecha}</a></li>`).join("")}</ol>
  </section>` : ""}

  <section class="notas" aria-label="Cómo funciona">
    <div><h3>Envíos</h3><p>${textoEnvio()}. Salen en 2 a 4 días hábiles.</p></div>
    <div><h3>Pago</h3><p>Con tarjeta, a través de Stripe. Nosotros nunca vemos los datos de tu tarjeta.</p></div>
    <div><h3>Cambios</h3><p>¿No te quedó la talla? Escríbenos dentro de los primeros 15 días y lo resolvemos.</p></div>
  </section>`;
}

/* ---------------- DETALLE ---------------- */
const NOTAS = ["de frente", "el detalle", "en uso", "por atrás", "el empaque"];

function vistaDetalle(slug) {
  if (PRODUCTOS === null) { vista.innerHTML = '<div class="esperando"><span data-b="coma"></span><h1>Cargando…</h1></div>'; return; }
  const p = PRODUCTOS.find(x => x.slug === slug);
  if (!p) {
    document.title = "Pieza no encontrada · Perpetuo";
    vista.innerHTML = `<a class="volver" href="#/">${ICO.atras} Toda la tienda</a>
      <div class="vacio"><span data-b="interrogacion"></span><h3>No encontramos esa pieza.</h3><p>Quizá cambió de nombre o ya no está a la venta.</p>
      <p style="margin-top:20px"><a class="btn" href="#/">Ver la tienda</a></p></div>`;
    return;
  }
  document.title = p.nombre + " · Tienda Perpetuo";
  // sin fotos todavía se muestran los cuatro huecos recomendados; con fotos, solo las que haya (hasta 5)
  const fotos = (p.imagenes || []).length ? p.imagenes.slice(0, 5).map((_, i) => i) : [0, 1, 2, 3];
  const tallas = conTallas(p), fuera = agotado(p);
  const otras = PRODUCTOS.filter(x => x.id !== p.id && !agotado(x)).sort((a, b) => (b.categoria === p.categoria) - (a.categoria === p.categoria)).slice(0, 3);

  vista.innerHTML = `
  <a class="volver" href="#/">${ICO.atras} Toda la tienda</a>
  <article class="det ${color(p)}">
    <div class="galeria">
      <div class="marco" id="principal">${foto(p, 0, NOTAS[0])}${etiqueta(p)}</div>
      ${fotos.length > 1 ? `<div class="miniaturas">${fotos.map(i => `<button class="marco mini" type="button" data-i="${i}" aria-label="Foto ${i + 1}" aria-pressed="${i === 0}">${foto(p, i)}</button>`).join("")}</div>` : ""}
    </div>
    <form class="ficha" id="agregar" novalidate>
      <span class="cat">${esc(p.categoria)}</span>
      <h1>${esc(p.nombre)}</h1>
      <b class="precio">${dinero(p.precio)}<small>MXN</small></b>
      <div class="desc">${formato(p.descripcion || p.resumen)}</div>
      ${tallas ? `<fieldset class="opciones" id="opciones"><legend>Talla</legend>
        <div class="tallas">${p.variantes.map(v => `<label class="talla"><input type="radio" name="variante" value="${esc(v.nombre)}"${v.disponibles ? "" : " disabled"}><span>${esc(v.nombre)}${v.disponibles ? "" : '<span class="sr"> (agotada)</span>'}</span></label>`).join("")}</div>
        <span class="msg">Elige tu talla.</span><span class="quedan" id="quedan" aria-live="polite"></span></fieldset>`
        : `<div class="opciones"><span class="quedan" id="quedan">${!fuera && existencias(p) <= 5 ? (existencias(p) === 1 ? "¡Queda 1!" : "Quedan " + existencias(p)) : ""}</span></div>`}
      ${fuera ? "" : `<div class="paso"><span class="lbl" id="lCant">Cantidad</span>
        <div class="stepper" role="group" aria-labelledby="lCant"><button type="button" data-d="-1" aria-label="Una menos">−</button><output id="cant" aria-live="polite">1</output><button type="button" data-d="1" aria-label="Una más">+</button></div></div>`}
      <button class="btn" id="btnAgregar" type="submit"${fuera ? " disabled" : ""}>${fuera ? "Agotado" : "Agregar a la bolsa " + ICO.flecha}</button>
      <p class="fino">${ICO.caja}Envío: ${textoEnvio().replace(/^A/, "a")}. Sale en 2 a 4 días hábiles.</p>
      <div class="mas">
        ${p.detalles ? `<details open><summary>Detalles y cuidado ${ICO.abajo}</summary><div class="txt">${formato(p.detalles)}</div></details>` : ""}
        <details><summary>Envíos y cambios ${ICO.abajo}</summary><div class="txt"><p>Enviamos por paquetería a cualquier parte de México. Te mandamos la guía de rastreo por correo en cuanto sale tu paquete.</p>
          <p>Si la talla no te quedó o algo llegó mal, escríbenos a <a href="mailto:general@perpetuo.global">general@perpetuo.global</a> dentro de los primeros 15 días.</p></div></details>
      </div>
    </form>
  </article>
  ${otras.length ? `<section class="otras" aria-labelledby="hOtras"><h2 id="hOtras">También hay</h2><ul class="rejilla">${otras.map(tarjeta).join("")}</ul></section>` : ""}`;
  activarDetalle(p);
}

function activarDetalle(p) {
  const f = document.getElementById("agregar"), principal = document.getElementById("principal");
  vista.querySelectorAll(".mini").forEach(m => m.addEventListener("click", () => {
    const i = Number(m.dataset.i);
    principal.innerHTML = foto(p, i, NOTAS[i]) + etiqueta(p);
    pintarBichos(principal);
    vista.querySelectorAll(".mini").forEach(x => x.setAttribute("aria-pressed", String(x === m)));
  }));
  const out = document.getElementById("cant");
  if (!out) return; // agotado
  const [menos, mas] = f.querySelectorAll(".stepper button"), quedan = document.getElementById("quedan"), ops = document.getElementById("opciones");
  let n = 1;
  // tope: lo disponible de la talla elegida, menos lo que ya está en la bolsa
  const variante = () => conTallas(p) ? (f.variante.value || null) : p.variantes[0].nombre;
  const tope = () => {
    const v = p.variantes.find(x => x.nombre === variante());
    if (!v) return CONFIG.MAX_POR_ARTICULO;
    const enBolsa = (Bolsa.leer().find(i => i.id === p.id && i.variante === v.nombre) || {}).cantidad || 0;
    return Math.max(Math.min(v.disponibles, CONFIG.MAX_POR_ARTICULO) - enBolsa, 0);
  };
  const ajustar = () => {
    const max = tope();
    n = Math.max(1, Math.min(n, max));
    out.textContent = n; menos.disabled = n <= 1; mas.disabled = n >= max;
  };
  f.querySelectorAll(".stepper button").forEach(b => b.addEventListener("click", () => { n += Number(b.dataset.d); ajustar(); }));
  f.addEventListener("change", ev => {
    if (ev.target.name !== "variante") return;
    ops.classList.remove("bad");
    const v = p.variantes.find(x => x.nombre === ev.target.value);
    quedan.textContent = v.disponibles <= 3 ? (v.disponibles === 1 ? "¡Queda 1 en esta talla!" : `Quedan ${v.disponibles} en esta talla`) : "";
    ajustar();
  });
  ajustar();

  f.addEventListener("submit", ev => {
    ev.preventDefault();
    const v = variante();
    if (v === null) { ops.classList.add("bad"); f.querySelector(".talla input:not(:disabled)").focus(); return; }
    if (tope() < 1) { toast("Ya tienes en tu bolsa todas las que quedan.", true); return; }
    Bolsa.agregar(p.id, v, n);
    n = 1; ajustar();
    cajon.showModal();
  });
}

/* ---------------- PEDIDO ---------------- */
const CLAVE_PEDIDO = "perpetuo-tienda-pedido";
function guardarPedido(o) { try { sessionStorage.setItem(CLAVE_PEDIDO, JSON.stringify(o)); } catch (e) {} }
function leerPedido() { try { return JSON.parse(sessionStorage.getItem(CLAVE_PEDIDO) || "null"); } catch (e) { return null; } }

function vistaPedido(esperando) {
  if (esperando) {
    document.title = "Confirmando tu pago · Perpetuo";
    vista.innerHTML = `<div class="esperando"><span data-b="punto"></span><h1>${esperando}</h1><p>No cierres esta ventana; tarda unos segundos.</p></div>`;
    return;
  }
  const o = leerPedido();
  if (!o) { location.replace("#/"); return; }
  const nombre = String(o.nombre || "").split(" ")[0];
  document.title = "¡Gracias! · Tienda Perpetuo";
  vista.innerHTML = `
  <section class="exito">
    <div class="desfile-fijo" aria-hidden="true"><span data-b="punto"></span><span data-b="coma"></span><span data-b="exclamacion"></span><span data-b="interrogacion"></span></div>
    <h1>¡Gracias${nombre ? `, <em>${esc(nombre)}</em>` : ""}!</h1>
    <p class="lead">Tu pedido ya está con nosotros. Te mandamos el recibo a <b>${esc(o.correo)}</b> y te escribiremos con la guía de rastreo en cuanto salga el paquete.</p>
    <div class="recibo">
      <div class="r-cabeza"><span class="logo" role="img" aria-label="Perpetuo"></span><span>Pedido pagado</span></div>
      <div class="r-cuerpo">
        <ul class="r-lineas">${o.items.map(i => `<li><span>${esc(i.nombre)}<small>${i.variante ? "Talla " + esc(i.variante) + " · " : ""}${i.cantidad} × ${dinero(i.precio)}</small></span><span>${dinero(i.precio * i.cantidad)}</span></li>`).join("")}</ul>
        <dl class="cuenta"><dt>Subtotal</dt><dd>${dinero(o.subtotal)}</dd><dt>Envío</dt><dd>${o.envio ? dinero(o.envio) : "Gratis"}</dd>
          <dt class="tot">Total</dt><dd class="tot">${dinero(o.total)} <small style="font-size:12px;letter-spacing:.03em;color:var(--gris)">MXN</small></dd></dl>
      </div>
      <div class="r-pie"><div><small>Folio</small><b>${esc(o.folio)}</b></div><div><small>Se envía a</small><p>${esc(o.nombre)}<br>${esc(o.direccion)}</p></div></div>
    </div>
    <p class="acts"><a class="btn btn--ghost" href="#/">${ICO.atras} Volver a la tienda</a></p>
  </section>`;
  confeti();
}

function confeti() {
  if (reducido) return;
  const c = document.createElement("div");
  c.className = "confeti"; c.setAttribute("aria-hidden", "true");
  const signos = ["¡", "!", "¿", "?", ".", ",", "·"], cols = ["var(--lima)", "var(--rojo)", "var(--azul)", "var(--tinta)"];
  c.innerHTML = Array.from({ length: 40 }, () => {
    const r = Math.random;
    return `<span style="--x:${(r() * 100).toFixed(1)}vw;--s:${(18 + r() * 34).toFixed(0)}px;--col:${cols[Math.floor(r() * 4)]};--dur:${(2.6 + r() * 2.4).toFixed(2)}s;--dl:${(.2 + r() * 1.2).toFixed(2)}s;--dx:${(r() * 160 - 80).toFixed(0)}px;--rot:${(r() * 720 - 360).toFixed(0)}deg">${signos[Math.floor(r() * signos.length)]}</span>`;
  }).join("");
  document.body.appendChild(c);
  setTimeout(() => c.remove(), 7000);
}

/* regreso de Stripe: ?pago=ok&session_id=cs_... | ?pago=cancelado */
async function regresoDePago() {
  const q = new URLSearchParams(location.search);
  const pago = q.get("pago");
  if (!pago) return false;
  if (pago === "cancelado") {
    history.replaceState(null, "", location.pathname + location.hash);
    setTimeout(() => toast("Cancelaste el pago. Tu bolsa sigue aquí; puedes intentarlo de nuevo."), 400);
    return false;
  }
  const sesion = q.get("session_id");
  history.replaceState(null, "", location.pathname + "#/pedido");
  rutaAnterior = "pedido";
  vistaPedido("Confirmando tu pago…"); pintarBichos(vista);
  for (let intento = 0; intento < 8; intento++) {
    try {
      const r = await api("confirmar", { session_id: sesion });
      if (r.pedido && r.estado === "pagado") { guardarPedido(r.pedido); Bolsa.vaciar(); pintar(); return true; }
    } catch (e) { console.error(e); }
    await new Promise(r => setTimeout(r, 2500));
  }
  vista.innerHTML = `<div class="esperando"><span data-b="interrogacion"></span><h1>Tu pago se está procesando</h1>
    <p>Cuando Stripe lo confirme te llegará el recibo por correo. Si en una hora no lo tienes, escríbenos a <a href="mailto:general@perpetuo.global">general@perpetuo.global</a>.</p>
    <p style="margin-top:24px"><a class="btn" href="#/">Volver a la tienda</a></p></div>`;
  pintarBichos(vista);
  return true;
}

/* ---------------- aviso ---------------- */
let tToast;
function toast(texto, mal) {
  const t = document.getElementById("toast");
  t.textContent = texto; t.classList.toggle("mal", !!mal); t.classList.add("on");
  clearTimeout(tToast); tToast = setTimeout(() => t.classList.remove("on"), 4200);
}

/* ---------------- arranque ---------------- */
if (!CONFIG.API_URL) document.getElementById("avisoDemo").hidden = false;
document.getElementById("desfile").innerHTML = [["punto", 52, 28, 0], ["coma", 32, 28, -7], ["exclamacion", 40, 28, -14], ["interrogacion", 38, 28, -21]]
  .map(([b, w, dur, dl]) => `<span class="caminante" style="--w:${w}px;--dur:${dur}s;--dl:${dl}s"><span data-b="${b}"></span></span>`).join("");
pintarBichos(document.getElementById("desfile"));
pintarBolsa();
regresoDePago().then(atendido => { if (!atendido) pintar(); cargarProductos(); });
</script>
